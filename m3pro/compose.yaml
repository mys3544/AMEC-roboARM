name: roboarm

# The vision container is all that is left here: the M3's own software runs on its host,
# under ROS 2 (tools/m3bridge.sh, arena/). The X3 Plus's core, web and bridge services went
# 2026-10-05 (in git).
services:
  # -------------------------------------------------------------- vision ----
  # YOLO26 / YOLOE-26 behind a tiny HTTP endpoint. GPU via CDI.
  # Started only with `--profile vision`. Holds NO camera: whoever wants a
  # detection posts it a frame.
  vision:
    profiles: ["vision"]
    build:
      context: .
      dockerfile: docker/vision.Dockerfile
    image: roboarm-vision:dev
    devices:
      - nvidia.com/gpu=all        # CDI (nvidia-container-toolkit 1.18)
    volumes:
      - ./vision_service:/app/vision_service:ro
      - ./tools:/app/tools:ro     # for tools/export_engine.py (TensorRT build)
      - ./models:/app/models      # weights + built TensorRT engines
    environment:
      PYTHONUNBUFFERED: "1"
      # The detector. A .pt path under /app/models, or a name Ultralytics can
      # fetch on first run while the robot has WiFi. A name containing "yoloe"
      # is loaded with the YOLOE loader.
      # 2026-09-14: the prompt-free YOLOE-26 segmenter (YOLOE built on YOLO26).
      # Its label is nonsense ("stop sign", "traffic sign") and ignored; the mask
      # is what counts (the X3's detect.range_block() sized it). Measured on the lab's
      # frames, conf 0.10, Orin GPU:
      #   yoloe-26s-seg-pf  red cube 0.86, tagged wooden cube 0.61,  41 ms  <- this
      #   yoloe-26m-seg-pf  red 0.85, tagged 0.85,                   55 ms
      #   yoloe-11s-seg-pf  red 0.63, tagged 0.82,                   43 ms  (was)
      #   yolo26n-seg       red 0.79 ("stop sign"), tagged NOTHING,  35 ms
      #   yolo26s-seg       red 0.45, tagged NOTHING,                37 ms
      # The plain yolo26*-seg are the fixed 80-class COCO models: they only find
      # what happens to look like a COCO class, so they are not the default.
      # Text prompts ("cube", "block", ...) found NOTHING on the tag-covered cube
      # on 2026-09-11, hence prompt-free and no prompting in the service at all.
      # Weights fetched by name on first run.
      ROBOARM_VISION_MODEL: ${ROBOARM_VISION_MODEL:-/app/models/yoloe-26s-seg-pf.pt}
      ROBOARM_VISION_IMGSZ: ${ROBOARM_VISION_IMGSZ:-640}
      ROBOARM_VISION_CONF: ${ROBOARM_VISION_CONF:-0.25}
      # Picks the depth engine built at this camera's aspect (vision_service/depth.py).
      ROBOARM_CAMERA: ${ROBOARM_CAMERA:-c930e}
    ports:
      - "127.0.0.1:8760:8760"     # localhost only, for debugging
