# One desktop on :0 whether or not a monitor is on the DisplayPort.
# Installed to /etc/X11/xorg.conf.d/ by tools/display_setup.sh; the vendor
# /etc/X11/xorg.conf is left as shipped.
#
# The Orin exposes two heads to X: DP-0 ("Internal DisplayPort" in the Xorg
# log), which is not wired to anything on this carrier board, and DP-1
# ("Internal TMDS", i.e. driven HDMI-style), the physical connector. Every
# monitor ever used on this robot was recorded by Mutter on DP-1
# (~/.config/monitors.xml), and `xrandr` with a monitor plugged in names it.
# Verified 2026-09-21 with an HP P244: EDID read, 1920x1080@60, Mutter shows
# one logical monitor.
#
# "ConnectedMonitor" makes the driver treat DP-1 as connected no matter what it
# detects. NOTE that it REPLACES detection: an earlier version of this file
# forced DP-0, so a real monitor on DP-1 was ignored and stayed black.
#
#   - no monitor: there is no EDID, so the driver uses the modeline below and
#     the desktop runs at 1920x1080. Mutter needs a *monitor*, not just a
#     framebuffer, to lay out a desktop and to screencast for remote desktop;
#     a forced-connected output gives it one. /etc/xdg/monitors.xml (from
#     tools/monitors.xml) pins that EDID-less monitor to 1920x1080@60,
#     otherwise Mutter picks 1024x768.
#   - monitor plugged in, at boot or later: the driver reads its EDID as usual,
#     the monitor runs at its own modes, and Mutter applies the user's saved
#     configuration for it. Unplugging goes back to the EDID-less state.
#
# With no ServerLayout, Xorg uses the first Screen section it finds, which is
# this one, so the Device below (not the vendor "Tegra0") is what runs.
# "AllowEmptyInitialConfiguration" is copied from the vendor file.
#
# Check after `sudo systemctl restart gdm3`: bash tools/display_setup.sh check
# Revert: sudo bash tools/display_setup.sh uninstall

Section "Device"
    Identifier  "Tegra0Headless"
    Driver      "nvidia"
    Option      "AllowEmptyInitialConfiguration" "true"
    Option      "ConnectedMonitor" "DP-1"
    # Without an EDID there is nothing to validate a mode against; let the
    # modeline below through. Only widens the mode list for a real monitor.
    # (This driver, L4T R36.4, does not know NoDFPNativeResolutionCheck.)
    Option      "ModeValidation" "AllowNonEdidModes,NoMaxPClkCheck,NoHorizSyncCheck,NoVertRefreshCheck,NoVirtualSizeCheck"
EndSection

Section "Monitor"
    Identifier   "HeadlessMonitor"
    # Used only when there is no EDID; a real monitor's EDID ranges win.
    HorizSync    28.0-90.0
    VertRefresh  48.0-75.0
    # CEA 1080p60 timing (148.5 MHz), accepted by any monitor that gets it.
    Modeline "1920x1080_60.00" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    # Never power the output down: a VNC viewer would see black. With a real
    # monitor this means it blanks but does not power-save.
    Option       "DPMS" "false"
EndSection

Section "Screen"
    Identifier   "HeadlessScreen"
    Device       "Tegra0Headless"
    Monitor      "HeadlessMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080_60.00"
        # Initial framebuffer size; Mutter resizes it for a real monitor.
        Virtual 1920 1080
    EndSubSection
EndSection
