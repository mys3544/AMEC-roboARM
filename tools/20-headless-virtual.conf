# Give the robot a usable desktop with no monitor plugged in.
#
# Two separate things are needed, and only having the first is why remote
# desktop failed with "Failed to record monitor: Unknown monitor":
#
#   1. A framebuffer of a sane size.  Xorg already starts headless thanks to
#      AllowEmptyInitialConfiguration in the vendor /etc/X11/xorg.conf, but with
#      no EDID it sizes the screen to 640x480. "Virtual" below pins it.
#
#   2. An output that reports as CONNECTED.  gnome-remote-desktop screencasts a
#      *monitor*, not the raw framebuffer, so with every output disconnected
#      Mutter has no monitor to hand it and the connection is dropped. The
#      ConnectedMonitor option in the vendor xorg.conf forces DP-0 to appear
#      connected; the modeline here gives it a valid mode without any EDID.
#
# Revert: delete this file, restore /etc/X11/xorg.conf from
# /etc/X11/xorg.conf.backup-roboarm, then `sudo systemctl restart gdm3`.

Section "Monitor"
    Identifier   "HeadlessMonitor"
    HorizSync    28.0-90.0
    VertRefresh  48.0-75.0
    # Standard CVT 1920x1080 @ 60 Hz, used when no EDID is available.
    Modeline "1920x1080_60.00" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option       "DPMS" "false"
EndSection

Section "Screen"
    Identifier   "HeadlessScreen"
    Device       "Tegra0"
    Monitor      "HeadlessMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080_60.00"
        Virtual 1920 1080
    EndSubSection
EndSection
