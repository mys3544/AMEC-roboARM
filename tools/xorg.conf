#
# This is the minimal configuration necessary to use the Tegra driver.
# Please refer to the xorg.conf man page for more configuration
# options provided by the X server, including display-related options
# provided by RandR 1.2 and higher.

# Disable extensions not useful on Tegra.
Section "Module"
    Disable     "dri"
    SubSection  "extmod"
        Option  "omit xfree86-dga"
    EndSubSection
EndSection

Section "Device"
    Identifier  "Tegra0"
    Driver      "nvidia"
# Allow X server to be started even if no display devices are connected.
    Option      "AllowEmptyInitialConfiguration" "true"

# --- headless support (added for the RoboARM project) ---------------------
# AllowEmptyInitialConfiguration above lets X start with no monitor, but every
# output then reports "disconnected", so Mutter exposes no monitor and
# gnome-remote-desktop fails with "Failed to record monitor: Unknown monitor".
# Forcing DP-0 to report as connected gives it a monitor to screencast.
    Option      "ConnectedMonitor" "DP-0"
# With no monitor there is no EDID, so allow the modeline from
# /etc/X11/xorg.conf.d/20-headless-virtual.conf to validate.
    Option      "ModeValidation" "AllowNonEdidModes,NoMaxPClkCheck,NoHorizSyncCheck,NoVertRefreshCheck,NoVirtualSizeCheck,NoDFPNativeResolutionCheck"
EndSection
