<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboARM console</title>
<link rel="stylesheet" href="console.css">
</head>
<body>
<header class="bar">
  <h1>RoboARM console</h1>
  <nav id="layouts" class="segmented" aria-label="Which robots to show"></nav>
  <span id="links" class="links"></span>
  <button id="talk" class="talk" title="hold, say a command, let go (or hold V)">Talk (hold V)</button>
  <span id="hint" class="hint">keys: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive, <kbd>Q</kbd><kbd>E</kbd> turn the M3 &middot; <kbd>Space</kbd> stops all</span>
  <button id="stopall" class="stopall" title="Space or Esc">STOP ALL</button>
</header>
<main id="cards" class="cards"></main>
<section id="voice" class="voicebox">
  <h2>Voice <span class="state">starting&hellip;</span></h2>
  <dl class="said">
    <dt>heard</dt><dd class="heard">&ndash;</dd>
    <dt>command</dt><dd><code class="command">&ndash;</code></dd>
    <dt>done</dt><dd class="done">&ndash;</dd>
    <dt>time</dt><dd class="timing">&ndash;</dd>
  </dl>
  <form class="typed">
    <input type="text" placeholder="or type one: pick up the red cube, X3 clear the table, go home, stop" aria-label="a command, typed">
    <button>Do it</button>
  </form>
</section>
<section class="logbox">
  <h2>Log</h2>
  <pre id="log"></pre>
</section>

<template id="card">
  <article class="card">
    <header class="card-head">
      <span class="swatch"></span>
      <h2 class="name"></h2>
      <span class="pill mode">offline</span>
      <span class="note"></span>
      <span class="spacer"></span>
      <a class="open" target="_blank" rel="noopener" title="the robot's own page">own page &#8599;</a>
      <button class="popout" title="this robot alone, in its own window">pop out</button>
      <button class="stop">STOP</button>
    </header>
    <div class="view"><img alt=""><span class="nosignal">no picture</span></div>
    <pre class="facts">connecting&hellip;</pre>
    <div class="controls"></div>
  </article>
</template>

<template id="m3-controls">
  <div class="drive">
    <div class="pad">
      <button data-keys="w a" title="W+A">&#8598;</button>
      <button data-keys="w" title="W">&#8593;</button>
      <button data-keys="w d" title="W+D">&#8599;</button>
      <button data-keys="a" title="A: sideways left">&#8592;</button>
      <button class="halt" title="stop this robot">&#9632;</button>
      <button data-keys="d" title="D: sideways right">&#8594;</button>
      <button data-keys="s a" title="S+A">&#8601;</button>
      <button data-keys="s" title="S">&#8595;</button>
      <button data-keys="s d" title="S+D">&#8600;</button>
    </div>
    <div class="side">
      <div class="turn">
        <button data-keys="q" title="Q">&#10226; turn</button>
        <button data-keys="e" title="E">turn &#10227;</button>
      </div>
      <label class="speed">speed <input type="range" min="20" max="100" value="60"> <output>60 %</output></label>
      <button class="auto">Auto: loop the arena</button>
      <button class="survey" title="stations chosen to see the whole floor, standing still at each: for a 3D scan">Auto: survey for a 3D scan</button>
      <label class="stepwise"><input type="checkbox"> stop and go: pause every 0.5 m</label>
      <button class="go" hidden>Continue (cable moved, arena clear)</button>
    </div>
  </div>
</template>

<template id="x3-controls">
  <div class="jobs">
    <button data-job="pick">Pick one</button>
    <button data-job="pickall">Clear the table</button>
    <button data-preset="home">Home</button>
  </div>
</template>

<template id="m3arm-controls">
  <div class="arm">
    <div class="jobs">
      <button data-pick="">Pick nearest</button>
      <button data-pick="cube">Pick a cube</button>
      <button data-pick="block">Pick a block</button>
      <button class="cleanup" title="every cube and block in reach, one by one, to the drop-off">Clean up all in reach</button>
      <button class="home">Home</button>
      <label class="stepwise" title="forward and sideways only, a few cm at a time; back to the start before each drop"><input type="checkbox" class="drive"> may drive closer to what is out of reach</label>
    </div>
    <div class="teach" title="teach a thing by showing it, then find it or pick it by its name">
      <input class="thing" placeholder="its name, e.g. apricot" aria-label="the thing's name" autocomplete="off">
      <button class="teach-it" title="the thing standing ALONE in front of the robot: the arm looks at it from round it and learns it by this name (about a minute)">Teach</button>
      <button class="find" title="names every thing on the table in front by what it was taught (the last look shows it)">Find</button>
      <button class="pick-named" title="finds the thing with this name and picks it into the box">Pick it</button>
    </div>
    <div class="scan" title="a 3D model of the thing in front: the robot drives round it (~2 min), then this laptop fuses the views into the 3D view">
      <button class="scan-it" title="the thing ALONE ~26 cm in front of the bumper, up to 20 cm tall, nothing else within ~70 cm of it: the robot drives a circle round it. With a name in the field above, it also learns the thing as that from the scan's views">Scan</button>
      <input class="tall" type="number" min="1" max="20" step="0.5" placeholder="height cm" aria-label="the thing's height, cm (only if the scan asks)" title="only if the scan says the thing runs off its picture: its height and width, cm">
      <input class="wide" type="number" min="1" max="30" step="0.5" placeholder="width cm" aria-label="the thing's width, cm (only if the scan asks)" title="the widest way across, cm, with the height">
      <button class="fuse-last" title="fetch the robot's newest scan and fuse it here again">Fuse last scan</button>
      <button class="teach-scan" title="learn the thing in the robot's newest scan by the name in the field above, from the scan's views all round it (the robot does not move)">Teach from last scan</button>
      <span class="scan-note"></span>
      <button class="in-3d" hidden>Show in 3D</button>
    </div>
    <label class="speed armspeed" title="every arm move, as a share of the speeds below">arm speed <input type="range" min="30" max="150" step="5" value="100"> <output>100 %</output></label>
    <details class="tuning">
      <summary>Speeds, pauses, fingertip room</summary>
      <div class="fields"><span class="note">loading from the robot&hellip;</span></div>
    </details>
    <table class="timing">
      <thead><tr><th>step, last job</th><th>s</th><th>mean s</th><th>n</th></tr></thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table>
    <pre class="armlog"></pre>
  </div>
</template>

<template id="cloud-card">
  <article class="card cloud">
    <header class="card-head">
      <span class="swatch"></span>
      <h2 class="name">3D scan</h2>
      <select class="pick" aria-label="Which scan"></select>
      <span class="note"></span>
      <span class="spacer"></span>
      <button class="popout" title="the 3D scan alone, in its own window">pop out</button>
    </header>
    <div class="scene"><canvas class="gl"></canvas><canvas class="print"></canvas><span class="nosignal">loading&hellip;</span></div>
    <div class="cloud-controls">
      <span class="choice shown"><button data-show="3d" class="on">3D</button><button data-show="floor">floor print</button></span>
      <span class="three">
        <span class="choice colour"><button data-colour="camera" class="on">camera colour</button><button data-colour="height">height</button></span>
        <label class="speed">points <input type="range" min="1" max="6" step="0.5" value="3"> <output>3 px</output></label>
        <button class="home" title="or double-click the picture">reset view</button>
        <span class="how">drag turns &middot; right-drag or <kbd>Shift</kbd>-drag moves &middot; wheel or pinch zooms</span>
      </span>
      <span class="how flat">the floor from above, 1 cm a pixel, turned to lie as the 3D view starts</span>
    </div>
    <pre class="facts"></pre>
  </article>
</template>

<script src="console.js"></script>
<script src="voice.js"></script>
</body>
</html>
